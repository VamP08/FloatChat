<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0b3a5b"/>
  <!-- A temperature profile: warm and near-constant at the surface, falling through
       the thermocline, near-vertical in the deep. Reads as a shape at 16px. -->
  <path d="M22 5 V11 Q22 15 13 21 Q10 23 10 27"
        fill="none" stroke="#5fd0e8" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
